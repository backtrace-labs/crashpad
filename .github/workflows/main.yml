name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "backtrace" branch
  push:
    branches: ["backtrace"]
    tags: ["v*"]
  pull_request:
    branches: ["backtrace"]
  schedule:
    - cron: '0 0 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        generator: ["Unix Makefiles", Ninja]

    steps:
      # Install latest CMake.
      - uses: lukka/get-cmake@latest

      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install curl headers
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: CMake
        run: |
          mkdir cbuild
          cmake -S . -B cbuild/ -DCRASHPAD_BUILD_EXAMPLES=TRUE -DCMAKE_BUILD_TYPE=Release -G "${{ matrix.generator }}"
          cmake --build cbuild/ --config Release

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          working-directory: ./backtrace/test
          bundler-cache: true

      - name: Run tests
        working-directory: ./backtrace/test
        run: >
          bundle exec ruby ./test.rb -v

      - name: Crashpad distribution ZIP
        run: |
          ruby backtrace/save_artifacts.rb --output Crashpad_Linux_build.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Crashpad_Linux_build_${{ matrix.generator }}
          path: Crashpad_Linux_build.zip

  build-windows:
    # Builds with Visual Studio Enterprise 2022
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        generator: ["Visual Studio 17 2022", Ninja]

    steps:
      # Install latest CMake.
      - uses: lukka/get-cmake@latest

      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Add cl.exe to PATH
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: CMake
        run: |
          # make a build directory (note: build is already used by Crashpad)
          mkdir cbuild

          # run CMake (additional options like -DCMAKE_EXPORT_COMPILE_COMMANDS=TRUE are possible)
          # it is recommended to specify the compiler version used for the build
          cmake -S . -B cbuild/ -DCRASHPAD_BUILD_EXAMPLES=TRUE -DCMAKE_BUILD_TYPE=Release -G "${{ matrix.generator }}" -DCMAKE_CXX_COMPILER=cl.exe -DCMAKE_C_COMPILER=cl.exe
          cmake --build cbuild/ --config Release

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          working-directory: ./backtrace/test
          bundler-cache: true

      - name: Run tests
        working-directory: ./backtrace/test
        run: |
          bundle exec ruby ./test.rb -v

      - name: Verify handler debug record
        if: matrix.generator == 'Visual Studio 17 2022'
        shell: pwsh
        run: |
          $line = (dumpbin /headers cbuild/handler/Release/crashpad_handler.exe | Select-String 'Format: RSDS').Line
          if (-not $line) { throw "crashpad_handler.exe has no CodeView record" }
          $m = [regex]::Match($line, '\{([0-9A-Fa-f-]+)\},\s*(\d+),\s*(.+)$')
          $id = ($m.Groups[1].Value -replace '-', '').ToUpper() + ('{0:X}' -f [int]$m.Groups[2].Value)
          $pdb = $m.Groups[3].Value.Trim()
          if ($pdb -ne 'crashpad_handler.pdb') { throw "crashpad_handler.exe records PDB '$pdb', expected 'crashpad_handler.pdb'" }
          "HANDLER_DEBUG_ID=$id" | Out-File -Append $env:GITHUB_ENV
          Write-Host "crashpad_handler.exe debugId=$id pdb=$pdb"

      - name: Install dump_syms
        if: matrix.generator == 'Visual Studio 17 2022'
        shell: pwsh
        run: |
          $v = "v2.3.9"
          Invoke-WebRequest "https://github.com/mozilla/dump_syms/releases/download/$v/dump_syms-x86_64-pc-windows-msvc.zip" -OutFile dump_syms.zip
          Expand-Archive dump_syms.zip -DestinationPath tools/dump_syms -Force
          $exe = Get-ChildItem tools/dump_syms -Recurse -Filter dump_syms.exe | Select-Object -First 1
          if (-not $exe) { throw "dump_syms.exe not found in the downloaded archive" }
          "DUMP_SYMS=$($exe.FullName)" | Out-File -Append $env:GITHUB_ENV
          & $exe.FullName --version

      - name: Generate crashpad_handler .sym
        if: matrix.generator == 'Visual Studio 17 2022'
        shell: pwsh
        run: |
          & $env:DUMP_SYMS cbuild/handler/Release/crashpad_handler.pdb --output cbuild/handler/Release/crashpad_handler.sym
          Get-Content cbuild/handler/Release/crashpad_handler.sym -TotalCount 1

      - name: Verify .sym matches the binary
        if: matrix.generator == 'Visual Studio 17 2022'
        shell: pwsh
        run: |
          $f = (Get-Content cbuild/handler/Release/crashpad_handler.sym -TotalCount 1) -split '\s+'
          if ($f[0] -ne 'MODULE' -or $f[4] -ne 'crashpad_handler.pdb') { throw "unexpected MODULE line: $f" }
          if ($f[3] -ne $env:HANDLER_DEBUG_ID) { throw ".sym debug id $($f[3]) != binary debug id $env:HANDLER_DEBUG_ID" }
          $stack = (Select-String -Path cbuild/handler/Release/crashpad_handler.sym -Pattern '^STACK ' -AllMatches).Count
          if ($stack -eq 0) { throw ".sym has no STACK (unwind) records" }
          Write-Host "OK: .sym matches crashpad_handler.exe ($env:HANDLER_DEBUG_ID), $stack unwind records"

      - name: Crashpad distribution ZIP
        run: |
          ruby backtrace/save_artifacts.rb --output Crashpad_Windows_build.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Crashpad_Windows_build_${{ matrix.generator }}
          path: Crashpad_Windows_build.zip

  build-macos:
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
        generator: ["Unix Makefiles", Ninja]

    steps:
      # Install latest CMake.
      - uses: lukka/get-cmake@latest

      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: CMake
        run: |
          mkdir cbuild
          cmake -S . -B cbuild/ -DCRASHPAD_BUILD_EXAMPLES=TRUE -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DCMAKE_OSX_SYSROOT=$(xcrun --sdk macosx --show-sdk-path) -G "${{ matrix.generator }}"
          cmake --build cbuild/ --config Release

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: ./backtrace/test
          ruby-version: "3.1"
          bundler-cache: true

      - name: Crashpad distribution ZIP
        run: |
          ruby backtrace/save_artifacts.rb --output Crashpad_MacOs_build_${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Crashpad_MacOs_build_${{ matrix.arch }}_${{ matrix.generator }}
          path: Crashpad_MacOs_build_${{ matrix.arch }}.zip

  build-android:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        # supported are: armeabi-v7a, arm64-v8a, x86_64. x86 (32-bit) is NOT supported
        abi: [armeabi-v7a, arm64-v8a, x86_64]
        # 64 bit architectures will always have min API level 21 https://stackoverflow.com/a/56467008
        apiLevel: [21, 33]
        ndk: [27.3.13750724]
        include:
          - apiLevel: 16
            abi: armeabi-v7a
            ndk: 27.3.13750724

    steps:
      # Install latest CMake.
      - uses: lukka/get-cmake@latest

      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Set env armeabi-v7a
        if: ${{ matrix.abi == 'armeabi-v7a' }}
        run: echo "SSL_MODE=NONE" >> $GITHUB_ENV

      - name: Set env others
        if: ${{ matrix.abi != 'armeabi-v7a' }}
        run: echo "SSL_MODE=OPENSSL" >> $GITHUB_ENV

      - name: CMake
        run: |
          mkdir cbuild
          cmake -S . -B cbuild/ -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/${{ matrix.ndk }}/build/cmake/android.toolchain.cmake -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-${{ matrix.apiLevel }} -DANDROID_NATIVE_API_LEVEL=${{ matrix.apiLevel }} -DANDROID_TOOLCHAIN=clang -DCRASHPAD_HTTPS_TRANSPORT=${{ env.SSL_MODE }} -DCRASHPAD_BUILD_EXAMPLES=TRUE -DCMAKE_BUILD_TYPE=Release
          cmake --build cbuild/ --config Release

      # save_artifacts.rb installs gems through bundler/inline, which needs a user-managed Ruby/Bundler.
      # The other platforms get this from ruby/setup-ruby.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"

      - name: Crashpad distribution ZIP
        run: |
          ruby backtrace/save_artifacts.rb --output Crashpad_Android_ndk${{ matrix.ndk }}_apiLevel${{ matrix.apiLevel }}_${{ matrix.abi }}_build.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Crashpad_Android_ndk${{ matrix.ndk }}_apiLevel${{ matrix.apiLevel }}_${{ matrix.abi }}_build
          path: Crashpad_Android_ndk${{ matrix.ndk }}_apiLevel${{ matrix.apiLevel }}_${{ matrix.abi }}_build.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-macos, build-android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release assets with stable names
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir -p release
          cp "artifacts/Crashpad_Windows_build_Visual Studio 17 2022/Crashpad_Windows_build.zip" "release/Crashpad_Windows_x64_${tag}.zip"
          cp "artifacts/Crashpad_Linux_build_Ninja/Crashpad_Linux_build.zip" "release/Crashpad_Linux_x86_64_${tag}.zip"
          for arch in arm64 x86_64; do
            cp "artifacts/Crashpad_MacOs_build_${arch}_Ninja/Crashpad_MacOs_build_${arch}.zip" "release/Crashpad_macOS_${arch}_${tag}.zip"
          done
          for d in artifacts/Crashpad_Android_*; do
            n=$(basename "$d"); cp "$d"/*.zip "release/${n%_build}_${tag}.zip"
          done
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release

      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag --title "Version ${GITHUB_REF_NAME#v}" --notes ""
